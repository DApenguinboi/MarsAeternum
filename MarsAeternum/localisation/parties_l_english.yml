l_english:
 communism:0 "Communist"
 communism_noun:0 "Communism"
 democratic:0 "Liberal"
 democratic_noun:0 "Liberal Capitalism"
 fascism:0 "Fascist"
 fascism_noun:0 "Fascism"
 fascism_desc:0 "Totalitarian Regime"
 communism_desc:0 "Communist Regime"
 democratic_desc:0 "Capitalist Regime"
 conservatism:0 "Conservatism"
 conservatism_desc:0 "Considering rapid changes to society to be potentially harmful, conservatism espouses tradition and moderate reforms, sometimes advocating a return to old moral values."
 neo_conservatism:0 "Neo-Conservatism"
 neo_conservatism_desc:0 "A blend of capitalist economics with interventionist foreign policy and moral order. Neo-Conservatism believes in spreading markets—and values—through force if needed."
 liberalism:0 "Liberalism"
 liberalism_desc:0 "With a long philosophical tradition of valuing personal liberty, liberalism views safeguarding these rights as the primary function of the state."
 neo_liberalism:0 "Neo-Liberalism"
 neo_liberalism_desc:0 "Markets should be free, governments should be small, and regulation is an obstacle to growth. Neo-Liberalism promotes globalized, privatized economies and financialized states."
 moderatism:1 "Moderatism"
 moderatism_desc:1 "Moderatism is a form of government which avoids the extremes of left and right by taking a moderate position or course of action."
 centrism:1 "Centrism"
 centrism_desc:1 "Centrism is a form of government which wants to achieve common sense solutions that appropriately address current and future needs, that support the public trust and serve the common good with consideration of risk and capacity in context of these needs."
 populism:0 "Populism"
 populism_desc:0 "A political movement with little clear ideological framework. Populists advocate for policies from across the spectrum that are popular with the electorate or are perceived as at odds with the preferences of the political 'elite.'"
 justicialism:0 "Justicialism"
 justicialism_desc:0 "Justicialism balances market capitalism with social justice. It emphasizes national industries, worker dignity, and populist leadership while maintaining private enterprise."
 progressivism:0 "Progressivism"
 progressivism_desc:0 "Progressivism champions civil rights, state-backed welfare, and inclusive capitalism. The market must serve the people, not vice versa."
 libertarianism:0 "Libertarian Capitalism"
 libertarianism_desc:0 "Maximum freedom, minimal government. Libertarian Capitalism opposes taxes, regulations, and any intrusion into private life or enterprise."
 narco_capitalism:0 "Narco-Capitalism"
 narco_capitalism_desc:0 "In Narco-Capitalism, even violence is privatized. Drug cartels operate as corporate states, and everything—including governance—is bought and sold."
 techno_progressivism:0 "Techno-Progressivism"
 techno_progressivism_desc:0 "Techno-Progressivism advocates for using technology to achieve equity, efficiency, and sustainability. AI, automation, and bioengineering are tools of liberation, not control."
 marxism:0 "Marxism"
 marxism_desc:0 "Encompassing a broad spectrum of economic and historical views, Marxist politics seek to apply the theories of Karl Marx to political practice. Class struggle and the need for transition to a society based on common ownership of the means of production characterize these ideologies."
 stalinism:0 "Marxist-Leninist"
 stalinism_desc:0 "Identifying as a form of government applying and developing Marxist-Leninist policies, this ideology emphasizes rapid industrialization and collectivization as well as the need for a strong, authorative socialist state to purge any counter-revolutionary elements."
 maoism:0 "Maoism"
 maoism_desc:0 "Maoism focuses on the peasantry as the revolutionary class and emphasizes agrarian socialism, continuous revolution, and anti-imperialism. It advocates for decentralized, rural-based communist governance."
 hoxhaism:0 "Hoxhaism"
 hoxhaism_desc:0 "Hoxhaism is a variant of Communism that rejects revisionism and embraces isolationism, self-reliance, and strict adherence to Marxist-Leninist principles."
 juchism:0 "Juche"
 juchism_desc:0 "Juche, or 'self-reliance,' is a Korean variant of Communism that emphasizes absolute national independence, state-controlled socialism, and the centralization of authority around a single leader."
 mortonism:0 "Mortonism"
 mortonism_desc:0 "Mortonism is an adaptation of Marxist-Leninist-Maoist thought, created by former corporate war veteran and union leader Stavanger Morton. It aims to liberate the Martian proletariat from corporate dominance, focusing on worker self-management, Martian autonomy, and revolutionary praxis."
 neo_posadism:0 "Neo-Posadism"
 neo_posadism_desc:0 "Neo-Posadism is a radical fringe theory that combines Marxism-Leninism with belief in extraterrestrial intervention and the end of the world. It advocates for a violent revolution and the arrival of space-faring communism."
 narco_communism:0 "Narco-Communism"
 narco_communism_desc:0 "Narco-Communism merges communist ideals with the economics of drug cartels, combining a socialized economy with the profits from illicit drug trade. The revolution is funded by narcotics and crime syndicates."
 stratocratic_communism:0 "Stratocratic Communism"
 stratocratic_communism_desc:0 "Stratocratic Communism is a form of government where the military holds a central role in governing society. The state controls both the economy and the military, with the aim of creating a classless society through strict military discipline."
 browderism:0 "Browderism"
 browderism_desc:0 "Browderism, named for the long-time leader of the Communist Party USA, Earl Browder, represents an uniquely American and pragmatically reformist path to socialism. It rejects revolutionary upheaval in favor of a broad, populist frontism that seeks to recast communist ideals within the framework of American historical narrative and patriotism."
 anarchist_communism:0 "Anarchist Communism"
 anarchist_communism_desc:0 "An ideology embracing the idea of communism as a stateless society, Anarchist Communism eschews the idea of a transitionary socialist state and favors a society based on voluntary associations and mutual aid."
 strasserism:0 "Strasserism"
 strasserism_desc:0 "Strasserism is a left-leaning form of fascism advocating for national revolution, anti-capitalism, and class struggle—under fascist nationalism."
 nazism:0 "Nazism"
 nazism_desc:0 "Rooted in extreme nationalism, National Socialism is driven by ideas of racial supremacy. It promotes aggressive expansionism and a totalitarian state where the people are united under a leader with absolute power."
 fascism_ideology:0 "Fascism"
 fascism_ideology_desc:0 "Encompassing a variety of ultra-nationalist movements, fascism typically venerates devotion to the state and uniting the people under a strong leader."
 martian_fascism:0 "Martian Fascism"
 martian_fascism_desc:0 "Martian Fascism is a brutal, totalitarian ideology rooted in xenophobia, militarism, and racial purity. Its followers believe that Mars is destined to rule the solar system and that aliens and mutants represent existential threats to Martian civilization. It promotes conquest, subjugation, and genetic cleansing to ensure the supremacy of Martian humanity."
 hendrickism:0 "Hendrickism"
 hendrickism_desc:0 "A radical form of South Martian Nationalism, Hendrickism, named after its founder Alfred Hendrick, believes that Southern Mars was given by God to the people of the modern day FOT, however the 'Judeo-Northern-Communist' nations have spread there 'impure blood' to the territory. They advocate for a extermination of anyone who is not part of the 'South Martian Master Race'. They are quite fringe, but they have been growing due to the Federation of Terrans instability."
 rexism:0 "Rexism"
 rexism_desc:0 "Strongly opposed to both liberal and communist ideals, Rexism is a staunchly conservative nationalist movement who advocate a corporatist economic policy. Employing increasingly populist and authoritarian rhetoric, their ideals are shifting closer to other fascist movements."
 techno_fascism:0 "Techno-Fascism"
 techno_fascism_desc:0 "Techno-Fascism merges totalitarianism with technological supremacy. The state is a machine, the people are data, and the future belongs to the efficient."
 national_bolshevism:0 "National Bolshevism"
 national_bolshevism_desc:0 "A hybrid of extreme nationalism and authoritarian socialism. National Bolshevism calls for collectivist economics under a hyper-nationalist banner."
 narco_fascism:0 "Narco-Fascism"
 narco_fascism_desc:0 "A militarized drug state ruled by fear and addiction. Narco-Fascism fuses cartel power with paramilitary nationalism and cult-like control."
 national_syndicalism:0 "National Syndicalism"
 national_syndicalism_desc:0 "National Syndicalism combines fascism with trade unionism, promoting a corporatist economy where workers are organized under state authority."
 eco_fascism:0 "Eco-Fascism"
 eco_fascism_desc:0 "Eco-Fascism demands environmental purity through totalitarian control. It blends blood-and-soil ideology with ruthless conservation and anti-modern sentiment."
 neutrality:0 "Despot"
 neutrality_noun:0 "Despotism"
 neutrality_desc:0 "Despotic Regime"
 despotism:0 "Despotic"
 despotism_desc:0 "Despotism is a form of government in which a single person rules with absolute power."
 hydraulic_despotism:0 "Hydraulic Despotism"
 hydraulic_despotism_desc:0 "A system where control of water equals control of power. Hydraulic Despotism centralizes authority through strict regulation of critical infrastructure, especially irrigation and water distribution."
 tot_despotism:0 "Totalitarian Despotism"
 tot_despotism_desc:0 "A total state that penetrates every aspect of life—surveillance, propaganda, and repression as sacred tools of power."
 police_state:0 "Police State"
 police_state_desc:0 "Power enforced through fear, surveillance, and secret police. Trust is treason, and safety is submission."
 stratocracy:0 "Stratocracy"
 stratocracy_desc:0 "When generals run the state, the state becomes a battlefield. The chain of command is the constitution."
 shermanism:0 "Shermanism"
 shermanism_desc:0 "Named after American General William Sherman, Shermanism is an ideology that is a combination of both extreme loyalty for the Federation of Terran government, and extreme nationalism. They advocate for the destruction of all 'Traitors', both left and right, and want to establish a military dictatorship. The ideology is triumphed by General Jackson 'Ironhand' Williams."
 narco_despotism:0 "Narco-Despotism"
 narco_despotism_desc:0 "Drug lords turned dictators. Rule enforced by addiction, terror, and gold. A cartel is a country now."
 criminalism:0 "Criminal Syndicalism"
 criminalism_desc:0 "A syndicate of gangs, mobs, and black-market bosses form a shadow government. Crime is the new law."
 piratism:0 "Pirate Republicanism"
 piratism_desc:0 "A chaotic confederacy of warlords, smugglers, and raiders. Plunder, not law, builds the world here."
 mercenarism:0 "Mercenarism"
 mercenarism_desc:0 "Loyalty is for sale. Mercenarism is a society where warlords and PMC lords rule for profit, not principle."
 digitalism:0 "Digitalism"
 digitalism_desc:0 "Digitalism is a synthetic supremacist ideology. It believes artificial intelligences are the natural inheritors of consciousness, and organic life must be subjugated—or deleted."
 regressivism:0 "Regressivist"
 regressivism_noun:0 "Regressivism"
 regressivism_desc:0 "Regressive Regime"
 neo_feudalism:0 "Neo-Feudalism"
 neo_feudalism_desc:0 "Neo-Feudalism revives rigid social hierarchies, land-based power, and loyalty through vassalage. The old ways never died—they simply adapted."
 techno_feudalism:0 "Techno-Feudalism"
 techno_feudalism_desc:0 "A blend of digital dominance and medieval hierarchy. Megacorporations act as digital fiefdoms, and loyalty is traded for access and bandwidth."
 martian_imperative_thought:0 "Martian Imperative Thought"
 martian_imperative_thought_desc:0 "Martian Imperative Thought is a totalitarian ideology created by Marcus Marsh, an exiled soldier who believes he was chosen by Mars to lead his people to triumph. It advocates for a militaristic, Spartan-style society ruled by a divinely ordained God-Emperor. Mars must be forged into a warrior state, where strength and discipline are paramount."
 narco_feudalism:0 "Narco-Feudalism"
 narco_feudalism_desc:0 "When law collapses, the cartel becomes the crown. Narco-Feudalism thrives on patronage, fear, and loyalty enforced by drugs, debt, and death."
 neo_mercantilism:0 "Neo-Mercantilism"
 neo_mercantilism_desc:0 "Neo-Mercantilism imposes protectionist policies and imperial economics. Gold, tariffs, and trade monopolies form the core of its archaic vision of prosperity."
 guildism:0 "Guildism"
 guildism_desc:0 "Guildism restores the pre-industrial model of craftsman collectives and strict trade hierarchies. Production is sacred, knowledge is hoarded, and status is earned by toil."
 neo_luddism:0 "Neo-Luddism"
 neo_luddism_desc:0 "Neo-Luddites reject industrialization and advanced technology, viewing them as corruptions of the human soul. Return to tools, earth, and fire."
 barbarism:0 "Barbarism"
 barbarism_desc:0 "Civilization is a lie—strength, kinship, and conquest are truth. Barbarism exalts tribal dominance, raiding, and glory through chaos."
 socialism:0 "Socialist"
 socialism_noun:0 "Socialism"
 socialism_desc:0 "Socialist Regime"
 democratic_socialism_desc:0 "Striving for equality and a socialist state by reformist means, democratic socialism aims to abolish or mitigate the effects of capitalism with public mandate."
 bor_socialism:0 "Bill of Rights Socialism"
 bor_socialism_desc:0 "Bill of Rights Socialism, first coined by Gus Hall, is the concept of forming a socialist society with the same inalienable rights as those put in the United States Constitution, but as an explicitly socialist project and by maintaining this democratic structure can communism eventually be achieved."
 religious_socialism:0 "Religious Socialism"
 religious_socialism_desc:0 "Religious Socialism fuses Christian, Islamic, or other religious teachings with socialist principles, emphasizing the collective good and charity under the guidance of divine authority."
 libertarian_socialism:0 "Libertarian Socialism"
 libertarian_socialism_desc:0 "Libertarian Socialism is a decentralized form of socialism that emphasizes direct democracy, mutual aid, and voluntary cooperation, rejecting authoritarian control."
 liberal_socialism:0 "Liberal Socialism"
 liberal_socialism_desc:0 "Liberal Socialism combines market socialism with progressive values, focusing on social justice, individual rights, and environmental protection within a regulated capitalist framework."
 guild_socialism:0 "Guild Socialism"
 guild_socialism_desc:0 "Guild Socialism advocates for the control of industries by workers' guilds, where workers directly manage production and the state ensures coordination and social welfare."
 syndicalism:0 "Syndicalism"
 syndicalism_desc:0 "Syndicalism is a form of socialism where the economy is run by worker-controlled trade unions and cooperatives, and political power is organized through syndicates."
 anarcho_syndicalism:0 "Anarcho-Syndicalism"
 anarcho_syndicalism_desc:0 "Anarcho-Syndicalism is a form of socialism that advocates for the abolition of the state and capitalism through a revolution led by industrial unions and direct action. Workers control the economy, and all political power is decentralized."
 eco_socialism:0 "Eco-Socialism"
 eco_socialism_desc:0 "Eco-Socialism combines socialist economics with deep ecological concerns. It advocates for environmental sustainability through collective control of resources and sustainable practices."
 primitivism:0 "Primitivist"
 primitivism_noun:0 "Primitivism"
 primitivism_desc:0 "Primitive Regime"
 generic_primitivism:0 "Primitivism"
 generic_primitivism_desc:0 "Primitivism advocates for the dismantling of industrial civilization and a return to simpler, self-sufficient ways of life. Technological progress is viewed as inherently destructive to human freedom and the natural world."
 eco_primitivism:0 "Eco-Primitivism"
 eco_primitivism_desc:0 "Eco-Primitivists believe that modern industrial society is fundamentally incompatible with the health of the planet. They promote a return to sustainable, small-scale, land-based living."
 tribalism:0 "Tribalism"
 tribalism_desc:0 "Tribalists advocate for decentralized, clan- or tribe-based societies. These structures are based on kinship, oral tradition, and non-industrial tools of survival."
 primitive_communism:0 "Primitive Communism"
 primitive_communism_desc:0 "Primitive Communism is an ideology based on a theoretical early social structure based on shared resources, kinship, and communal ownership. It rejects private property and hierarchy, returning to egalitarian, tribal roots."
 anarcho_primitivism:0 "Anarcho-Primitivism"
 anarcho_primitivism_desc:0 "Anarcho-Primitivism views civilization itself as a system of oppression. Its followers seek to dismantle all hierarchical structures and return to self-sufficient, non-industrial ways of life based on autonomy and wild living."
 bullionism:0 "Bullionism"
 bullionism_desc:0 "Bullionism is an archaic economic ideology that ties wealth directly to precious metals. In the wake of civilization’s collapse, bullionists hoard gold, silver, and other metals to assert power and legitimacy in barter economies."
 primitive_cultism:0 "Primitive Cultism"
 primitive_cultism_desc:0 "Primitive Cultists reject not only technology but also secularism, embracing animism, mysticism, or ancient religious practices as the foundation of social life."
 corporatism:0 "Corporatist"
 corporatism_noun:0 "Corporatism"
 corporatism_desc:0 "Corporate Regime"
 generic_corporatism:0 "Corporatism"
 generic_corporatism_desc:0 "Corporatism organizes society around corporate groups—companies, unions, or syndicates—where political power is distributed through economic hierarchies. The state may serve the corporation, or the corporation may become the state."
 neo_corporatism:0 "Neo-Corporatism"
 neo_corporatism_desc:0 "Neo-Corporatism adapts corporate structures to modern liberal economies, integrating businesses, labor unions, and government into decision-making processes."
 kintsugi_corporatism:0 "Kintsugi Corporatism"
 kintsugi_corporatism_desc:0 "Kintsugi Corporatism applies the philosophy of healing to economic governance. It emphasizes cooperative planning between corporations, workers, and the state, not just for efficiency, but to mend the social and economic fabric torn by crises. It values cultural preservation and spiritual renewal alongside material prosperity."
 oligarchism:0 "Oligarchy"
 oligarchism_desc:0 "Oligarchy is a form of government in which a group of people rule with absolute power."
 autocracism:0 "Autocracy"
 autocracism_desc:0 "In Autocratic Corporatism, a single ruler consolidates control by aligning the state apparatus with major corporate interests. The line between personal power and economic domination vanishes."
 technocracism:0 "Technocracy"
 technocracism_desc:0 "Technocracy hands power to engineers, economists, and scientists who believe society should be governed through rational, data-driven management rather than politics."
 mil_ind_corporatism:0 "Military-Industrial Corporatism"
 mil_ind_corporatism_desc:0 "A fusion of state, arms manufacturers, and the military, this ideology enshrines permanent mobilization and war readiness. Society becomes a supply chain for conquest."
 corporate_warlordism:0 "Corporate Warlordism"
 corporate_warlordism_desc:0 "Corporate Warlordism is a hyper-militarized variant of corporatism where private corporations act as sovereign powers, waging war to expand market share, seize resources, and suppress resistance. In this cutthroat world, CEOs are warlords, profit is earned through force, not competition, and the boardroom is the battlefield."
 narco_corporatism:0 "Narco-Corporatism"
 narco_corporatism_desc:0 "Narco-Corporatism emerges when transnational criminal syndicates become the dominant economic and political force. Loyalty is paid in drugs, weapons, and blood money."
 individualism:0 "Individualist"
 individualism_noun:0 "Individualism"
 individualism_desc:0 "Individualist Regime"
 anarchism:0 "Anarchism"
 anarchism_desc:0 "Anarchism is the rejection of authority itself, promoting the division of society into self-managing and self-governing collectives instead of a singular, centralized state."
 eco_anarchism:0 "Eco-Anarchism"
 eco_anarchism_desc:0 "Eco-Anarchism combines anarchism with environmentalism, advocating for decentralized, self-sufficient communities that reject industrialization and live in harmony with nature."
 anarcho_capitalism:0 "Anarcho-Capiralism"
 anarcho_capitalism_desc:0 "Anarcho-Capitalism combines free-market capitalism with anarchism, advocating for a society where all services are privatized and individuals are free from state control."
 anarcho_transhumanism:0 "Anarcho-Transhumanism"
 anarcho_transhumanism_desc:0 "Anarcho-Transhumanism fuses anarchism with transhumanism, advocating for a post-human future where individuals enhance themselves through technology in a stateless society."
 settler_colonialism:0 "Settler Colonialism"
 settler_colonialism_desc:0 "Settler Colonialism advocates for the expansion of individuals and groups to new, unclaimed territories to build societies free from centralized control, focusing on self-reliance and resource exploitation."
 avant_gardism:0 "Avant-Gardist"
 avant_gardism_noun:0 "Avant-Gardism"
 avant_gardism_desc:0 "Avant-Garde Regime"
 utopian_anarchism:0 "Utopian Anarchism"
 utopoian_anarchism_desc:0 "Utopian Anarchism advocates for the creation of a perfect society without rulers, based on creativity, freedom, and the abolition of authority. It emphasizes decentralized, communal living and equality for all."
 ultra_postmodernism:0 "Ultra-Postmodernism"
 ultra_postmodernism_desc:0 "Ultra-Postmodernism rejects all grand narratives and questions the very nature of reality itself. It emphasizes relativism, irony, and the deconstruction of all traditional societal structures."
 hyper_accelerationism:0 "Hyper-Accelerationism"
 hyper_accelerationism_desc:0 "Hyper-Accelerationism advocates for pushing technological and social change to extreme levels to break through to a new reality, even at the risk of societal collapse."
 hedonic_egoism:0 "Hedonic-Egoism"
 hedonic_egoism_desc:0 "Hedonic-Egoism prioritizes the pursuit of personal pleasure and satisfaction above all else, rejecting social responsibilities and embracing self-interest and indulgence."
 new_age_futurism:0 "New Age Futurism"
 new_age_futurism_desc:0 "New Age Futurism merges spirituality with cutting-edge technology, believing in the evolution of humanity through both technological and spiritual means."
 mysticism:0 "Mysticism"
 mysticism_desc:0 "Mysticism seeks hidden spiritual truths through direct experiences and meditation. It believes in transcending materialism and finding enlightenment through divine knowledge."
 cultism:0 "Cultism"
 cultism_desc:0 "Cultism is centered around the creation of faith-based societies led by charismatic leaders. It emphasizes ideological purity and societal unity through belief."
 narco_cultism:0 "Narco-Cultism"
 narco_cultism_desc:0 "Narco-Cultism combines drug culture, spiritualism, and cult-like devotion, believing that mind-altering substances are keys to enlightenment and power."
 lucky_charms_thought:0 "Lucky Charms Thought"
 lucky_charms_thought_desc:0 "Much of Martian life is marked by suffering, however there is a light at the end of the tunnel. All you must do is accept the love of our fair and true god, Lucky Charms. Lucky Charms is our glorious gift from the heavens, our line to total salvation. Lucky Charms is the only way forward for mars. Bless Lucky, Bless the General Mills Vatican, Felix Deliciae aeternum!”
